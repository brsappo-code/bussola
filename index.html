<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bússola Diária - Método Groppo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --subtext-color: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h2 {
      margin-top: 0;
      font-size: 1.3rem;
      text-align: center;
      color: var(--accent-color);
    }

    .user-info {
      font-size: 0.85rem;
      color: var(--subtext-color);
      background: rgba(255,255,255,0.05);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-align: center;
    }

    .field-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .chip-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-btn {
      flex: 1;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .chip-btn.selected {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type=range] {
      flex: 1;
      accent-color: var(--accent-color);
    }

    .slider-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
      min-width: 35px;
      text-align: right;
    }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
    }

    .locked-card {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="ritoTitulo">🧭 Bússola Diária</h2>
    <div class="user-info" id="userDisplay">Carregando...</div>

    <form id="bussolaForm">
      <div id="formContent"></div>
      <button type="submit" id="btnEnviar" class="submit-btn" style="display:none;">Salvar Registro</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const URL_DO_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzGfSW-yjoTod01HxxzDuQq3Fvj376AMgU6U7GJU_4NSxiZutvhk09TRafTyFp7De6I/exec";

    const tg = window.Telegram.WebApp;
    tg.expand();

    let userChatId = "";
    let userName = "";

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      userChatId = String(u.id);
      userName = ((u.first_name || "") + " " + (u.last_name || "")).trim();
    }

    if (!userName) userName = "Alquimista";
    if (!userChatId) userChatId = "Sem Chat ID";

    document.getElementById('userDisplay').innerHTML = `Alquimista: <b>${userName}</b>`;

    const horaAtual = new Date().getHours();
    let ritoNome = "";
    let formHTML = "";

    if (horaAtual >= 5 && horaAtual < 12) {
      ritoNome = "Rito da Manhã";
      formHTML = `
        <div class="field-group">
          <label>Como acordou hoje? (Disposição / Rigidez):</label>
          <div class="slider-container">
            <input type="range" id="m_disposicao" min="1" max="5" value="3" oninput="document.getElementById('v_disp').innerText = this.value + '/5'">
            <span class="slider-value" id="v_disp">3/5</span>
          </div>
        </div>
      `;
    } else if (horaAtual >= 12 && horaAtual < 18) {
      ritoNome = "Rito da Tarde";
      formHTML = `
        <div class="field-group">
          <label>Pausas & Movimento:</label>
          <div class="chip-group" id="pausasGroup">
            <div class="chip-btn" onclick="selectChip(this, 'pausaVal', 'Muito Tempo Sentado')">Sem Pausas</div>
            <div class="chip-btn" onclick="selectChip(this, 'pausaVal', 'Pausas Parciais')">Parciais</div>
            <div class="chip-btn selected" onclick="selectChip(this, 'pausaVal', 'Alonguei / Caminhei')">Alonguei / Caminhei</div>
          </div>
          <input type="hidden" id="pausaVal" value="Alonguei / Caminhei">
        </div>

        <div class="field-group">
          <label>Hidratação & Nutrição:</label>
          <div class="slider-container">
            <input type="range" id="t_hidratacao" min="1" max="5" value="3" oninput="document.getElementById('v_hidra').innerText = this.value + '/5'">
            <span class="slider-value" id="v_hidra">3/5</span>
          </div>
        </div>
      `;
    } else if (horaAtual >= 18 && horaAtual <= 23) {
      ritoNome = "Rito da Noite";
      formHTML = `
        <div class="field-group">
          <label>Treinou hoje?</label>
          <div class="chip-group">
            <div class="chip-btn selected" onclick="selectChip(this, 'treinoVal', 'Sim')">Sim</div>
            <div class="chip-btn" onclick="selectChip(this, 'treinoVal', 'Não')">Não</div>
          </div>
          <input type="hidden" id="treinoVal" value="Sim">
        </div>

        <div class="field-group">
          <label>Humor / Satisfação com o dia:</label>
          <div class="slider-container">
            <input type="range" id="n_humor" min="1" max="5" value="3" oninput="document.getElementById('v_humor').innerText = this.value + '/5'">
            <span class="slider-value" id="v_humor">3/5</span>
          </div>
        </div>
      `;
    } else {
      ritoNome = "Fora de Horário";
      formHTML = `
        <div class="locked-card">
          <p>🌙 O período de registros está fechado.</p>
          <p style="color: var(--subtext-color); font-size: 0.85rem;">A Bússola da Manhã abre às 05:00. Descanse bem!</p>
        </div>
      `;
    }

    document.getElementById('ritoTitulo').innerText = "🧭 " + ritoNome;
    document.getElementById('formContent').innerHTML = formHTML;

    if (ritoNome !== "Fora de Horário") {
      document.getElementById('btnEnviar').style.display = "block";
    }

    function selectChip(el, targetId, val) {
      const parent = el.parentElement;
      parent.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById(targetId).value = val;
    }

    document.getElementById('bussolaForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      let respostaString = "";

      if (ritoNome === "Rito da Manhã") {
        respostaString = "Disposição/Rigidez: " + document.getElementById('m_disposicao').value + "/5";
      } else if (ritoNome === "Rito da Tarde") {
        respostaString = "Pausas: " + document.getElementById('pausaVal').value + " | Hidratação/Foco: " + document.getElementById('t_hidratacao').value + "/5";
      } else if (ritoNome === "Rito da Noite") {
        respostaString = "Treino: " + document.getElementById('treinoVal').value + " | Humor: " + document.getElementById('n_humor').value + "/5";
      }

      const btn = document.getElementById('btnEnviar');
      const statusDiv = document.getElementById('status');

      btn.disabled = true;
      btn.innerText = "Salvando...";
      statusDiv.style.color = "#38bdf8";
      statusDiv.innerText = "Enviando registro...";

      const payload = {
        chatId: userChatId,
        nome: userName,
        rito: ritoNome,
        resposta: respostaString
      };

      fetch(URL_DO_APPS_SCRIPT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.style.color = "#4ade80";
        statusDiv.innerText = "✅ Registro salvo com sucesso!";
        setTimeout(() => { tg.close(); }, 1200);
      })
      .catch((err) => {
        statusDiv.style.color = "#f87171";
        statusDiv.innerText = "❌ Falha ao salvar.";
        btn.disabled = false;
        btn.innerText = "Salvar Registro";
      });
    });
  </script>
</body>
</html>
