<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bússola — Oficina dos Alquimistas</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: var(--tg-theme-link-color, #2481cc);
      text-align: center;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid var(--tg-theme-link-color, #2481cc);
      background: transparent;
      color: var(--tg-theme-link-color, #2481cc);
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .field-group {
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
    }
    small {
      color: #666;
      display: block;
      margin-top: 4px;
    }
    input[type="range"] {
      width: 100%;
      margin: 12px 0;
    }
    .radio-group {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      cursor: pointer;
    }
    .val-display {
      text-align: right;
      font-weight: bold;
      color: var(--tg-theme-link-color, #2481cc);
    }
    .btn-submit {
      width: 100%;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:disabled {
      opacity: 0.6;
    }
    .rito-content {
      display: none;
    }
    .rito-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <h2>🧭 Bússola Diária</h2>

  <!-- Seleção dos 3 Ritos -->
  <div class="tabs">
    <button class="tab-btn active" onclick="selecionarRito('Manhã')">☀️ Manhã</button>
    <button class="tab-btn" onclick="selecionarRito('Tarde')">🌤️ Tarde</button>
    <button class="tab-btn" onclick="selecionarRito('Noite')">🌙 Noite</button>
  </div>

  <form id="formBussola">

    <!-- FORMULÁRIO 1: RITO DA MANHÃ -->
    <div id="rito-Manhã" class="rito-content active">
      <div class="field-group">
        <label for="rigidez">
          <b>Rigidez / Dor (Corpo)</b>
          <small>(1 = Corpo livre/sem dor, 5 = Muito rígido/com dor)</small>
        </label>
        <input type="range" id="rigidez" min="1" max="5" value="3" oninput="document.getElementById('valRigidez').innerText = this.value">
        <div class="val-display">Nível: <span id="valRigidez">3</span>/5</div>
      </div>

      <div class="field-group">
        <label for="disposicao">
          <b>Disposição / Humor (Mente)</b>
          <small>(1 = Sem energia/desanimado, 5 = Alta disposição/animado)</small>
        </label>
        <input type="range" id="disposicao" min="1" max="5" value="3" oninput="document.getElementById('valDisposicao').innerText = this.value">
        <div class="val-display">Nível: <span id="valDisposicao">3</span>/5</div>
      </div>
    </div>

    <!-- FORMULÁRIO 2: RITO DA TARDE -->
    <div id="rito-Tarde" class="rito-content">
      <div class="field-group">
        <label><b>Pausa Ativa (2 a 5 min)</b></label>
        <div class="radio-group">
          <label><input type="radio" name="pausaAtiva" value="Sim" checked> Sim</label>
          <label><input type="radio" name="pausaAtiva" value="Não"> Não</label>
        </div>
      </div>

      <div class="field-group">
        <label for="hidratacao">
          <b>Hidratação (Lítros)</b>
          <small>(Meta contínua de consumo)</small>
        </label>
        <input type="range" id="hidratacao" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('valHidratacao').innerText = parseFloat(this.value).toFixed(1)">
        <div class="val-display"><span id="valHidratacao">1.0</span> L</div>
      </div>
    </div>

    <!-- FORMULÁRIO 3: RITO DA NOITE -->
    <div id="rito-Noite" class="rito-content">
      <div class="field-group">
        <label><b>Atividade Física / Prática</b></label>
        <div class="radio-group">
          <label><input type="radio" name="atividadeFisica" value="Treino" checked> Treino</label>
          <label><input type="radio" name="atividadeFisica" value="Meditação"> Meditação</label>
          <label><input type="radio" name="atividadeFisica" value="Nada"> Nada</label>
        </div>
      </div>

      <div class="field-group">
        <label for="humorNoite">
          <b>Humor (Mente)</b>
          <small>(1 = Ruim, 5 = Excelente)</small>
        </label>
        <input type="range" id="humorNoite" min="1" max="5" value="3" oninput="document.getElementById('valHumorNoite').innerText = this.value">
        <div class="val-display">Nível: <span id="valHumorNoite">3</span>/5</div>
      </div>
    </div>

    <button type="button" id="btnSalvar" class="btn-submit" onclick="enviarRegistro()">Salvar Rito da Manhã</button>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
    }

    // ⚠️ ATENÇÃO: COLE SUA URL DO GOOGLE APPS SCRIPT ABAIXO
    const WEBHOOK_URL = "SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";

    let ritoAtual = "Manhã";

    function selecionarRito(rito) {
      ritoAtual = rito;
      
      const btns = document.querySelectorAll('.tab-btn');
      btns.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.querySelectorAll('.rito-content').forEach(div => div.classList.remove('active'));
      document.getElementById(`rito-${rito}`).classList.add('active');

      document.getElementById('btnSalvar').innerText = `Salvar Rito da ${rito}`;
    }

    function enviarRegistro() {
      const btn = document.getElementById("btnSalvar");
      btn.disabled = true;
      btn.innerText = "Salvando...";

      let respostaFormatada = "";

      if (ritoAtual === "Manhã") {
        const rigidez = document.getElementById("rigidez").value;
        const disposicao = document.getElementById("disposicao").value;
        respostaFormatada = `R=${rigidez}/5 | D=${disposicao}/5`;

      } else if (ritoAtual === "Tarde") {
        const pausa = document.querySelector('input[name="pausaAtiva"]:checked').value;
        const agua = document.getElementById("hidratacao").value;
        respostaFormatada = `Pausa Ativa: ${pausa} | Hidratação: ${parseFloat(agua).toFixed(1)}L`;

      } else if (ritoAtual === "Noite") {
        const atividade = document.querySelector('input[name="atividadeFisica"]:checked').value;
        const humor = document.getElementById("humorNoite").value;
        respostaFormatada = `Prática: ${atividade} | Humor: ${humor}/5`;
      }

      const usuario = tg?.initDataUnsafe?.user;
      let nomeCompleto = "Alquimista";

      if (usuario) {
        const primeiroNome = usuario.first_name || "";
        const sobrenome = usuario.last_name || "";
        nomeCompleto = `${primeiroNome} ${sobrenome}`.trim();
      }

      const payload = {
        chatId: usuario?.id || "Sem Chat ID",
        nome: nomeCompleto,
        rito: `Rito da ${ritoAtual}`,
        resposta: respostaFormatada
      };

      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.innerText = "✅ Registrado!";
        setTimeout(() => {
          if (tg) tg.close();
        }, 1200);
      })
      .catch((erro) => {
        alert("Erro ao salvar. Tente novamente.");
        btn.disabled = false;
        btn.innerText = `Salvar Rito da ${ritoAtual}`;
        console.error(erro);
      });
    }
  </script>
</body>
</html>
