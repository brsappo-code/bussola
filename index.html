<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bússola — Oficina dos Alquimistas</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: var(--tg-theme-link-color, #2481cc);
      text-align: center;
    }
    .field-group {
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
    }
    small {
      color: #666;
      display: block;
      margin-top: 4px;
    }
    input[type="range"] {
      width: 100%;
      margin: 12px 0;
    }
    .val-display {
      text-align: right;
      font-weight: bold;
      color: var(--tg-theme-link-color, #2481cc);
    }
    button {
      width: 100%;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <h2>🧭 Rito da Manhã</h2>

  <form id="formBussola">
    <!-- BARRA 1: RIGIDEZ / DOR -->
    <div class="field-group">
      <label for="rigidez">
        <b>Rigidez / Dor (Corpo)</b>
        <small>(1 = Corpo livre/sem dor, 5 = Muito rígido/com dor)</small>
      </label>
      <input type="range" id="rigidez" min="1" max="5" value="3" oninput="document.getElementById('valRigidez').innerText = this.value">
      <div class="val-display">Nível: <span id="valRigidez">3</span>/5</div>
    </div>

    <!-- BARRA 2: DISPOSIÇÃO / HUMOR -->
    <div class="field-group">
      <label for="disposicao">
        <b>Disposição / Humor (Mente)</b>
        <small>(1 = Sem energia/desanimado, 5 = Alta disposição/animado)</small>
      </label>
      <input type="range" id="disposicao" min="1" max="5" value="3" oninput="document.getElementById('valDisposicao').innerText = this.value">
      <div class="val-display">Nível: <span id="valDisposicao">3</span>/5</div>
    </div>

    <button type="button" id="btnSalvar" onclick="enviarRegistro()">Salvar Rito da Manhã</button>
  </form>

  <script>
    // Inicializa a API do Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
    }

    // ⚠️ COLE AQUI A SUA URL DO GOOGLE APPS SCRIPT
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzGfSW-yjoTod01HxxzDuQq3Fvj376AMgU6U7GJU_4NSxiZutvhk09TRafTyFp7De6I/exec";

    function enviarRegistro() {
      const btn = document.getElementById("btnSalvar");
      btn.disabled = true;
      btn.innerText = "Salvando...";

      // Captura os valores individuais das duas barras
      const rigidez = document.getElementById("rigidez").value;
      const disposicao = document.getElementById("disposicao").value;

      // Formata exatamente para a mesma coluna: R= x/5 | D= x/5
      const respostaFormatada = `R=${rigidez}/5 | D=${disposicao}/5`;

      // Monta o payload padronizado que seu Apps Script espera
      const payload = {
        chatId: tg?.initDataUnsafe?.user?.id || "Sem Chat ID",
        nome: tg?.initDataUnsafe?.user?.first_name || "Alquimista",
        rito: "Rito da Manhã",
        resposta: respostaFormatada
      };

      // Dispara os dados para o Google Apps Script
      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.innerText = "✅ Registrado!";
        setTimeout(() => {
          if (tg) {
            tg.close();
          }
        }, 1200);
      })
      .catch((erro) => {
        alert("Erro ao salvar. Tente novamente.");
        btn.disabled = false;
        btn.innerText = "Salvar Rito da Manhã";
        console.error(erro);
      });
    }
  </script>
</body>
</html>
