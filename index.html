<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bússola Diária</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --button-bg: #0284c7;
      --button-hover: #0369a1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 1.3rem;
      text-align: center;
    }

    .user-info {
      font-size: 0.9rem;
      text-align: center;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .range-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-color);
    }

    .range-value {
      font-weight: bold;
      color: var(--accent-color);
      min-width: 24px;
      text-align: right;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--button-bg);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--button-hover);
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: 500;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="ritoTitulo">Rito Diário</h2>
    <div class="user-info" id="userInfo">Carregando perfil...</div>

    <form id="bussolaForm">
      <div id="formFields">
        <!-- Campos dinâmicos carregados via JS -->
      </div>

      <button type="submit" id="btnEnviar">Salvar Registro</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    // Inicializa o SDK do Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // URL do Web App do Apps Script
    const URL_DO_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzGfSW-yjoTod01HxxzDuQq3Fvj376AMgU6U7GJU_4NSxiZutvhk09TRafTyFp7De6I/exec";

    // Captura dados do usuário logado no Telegram
    const user = tg.initDataUnsafe?.user;
    const userChatId = user?.id || "Desconhecido";
    const userName = user ? `${user.first_name} ${user.last_name || ''}`.trim() : "Alquimista";

    document.getElementById('userInfo').innerText = `Alquimista: ${userName}`;

    // Define o Rito automaticamente baseado no horário
    const horaAtual = new Date().getHours();
    let ritoNome = "";
    const fieldsDiv = document.getElementById('formFields');

    if (horaAtual < 12) {
      ritoNome = "Rito da Manhã";
      fieldsDiv.innerHTML = `
        <div class="form-group">
          <label for="m_disposicao">Nível de Disposição e Rigidez (1 a 5):</label>
          <div class="range-container">
            <input type="range" id="m_disposicao" min="1" max="5" value="3" oninput="document.getElementById('v_disp').innerText = this.value">
            <span class="range-value" id="v_disp">3</span>
          </div>
        </div>
      `;
    } else if (horaAtual < 18) {
      ritoNome = "Rito da Tarde";
      fieldsDiv.innerHTML = `
        <div class="form-group">
          <label for="pausaVal">Fez as pausas ativas hoje?</label>
          <select id="pausaVal">
            <option value="Sim">Sim</option>
            <option value="Parcialmente">Parcialmente</option>
            <option value="Não">Não</option>
          </select>
        </div>
        <div class="form-group">
          <label for="t_hidratacao">Hidratação e Foco (1 a 5):</label>
          <div class="range-container">
            <input type="range" id="t_hidratacao" min="1" max="5" value="3" oninput="document.getElementById('v_hidra').innerText = this.value">
            <span class="range-value" id="v_hidra">3</span>
          </div>
        </div>
      `;
    } else {
      ritoNome = "Rito da Noite";
      fieldsDiv.innerHTML = `
        <div class="form-group">
          <label for="treinoVal">Treino / Atividade Física efetuada?</label>
          <select id="treinoVal">
            <option value="Realizado com Sucesso">Realizado com Sucesso</option>
            <option value="Treino Leve / Caminhada">Treino Leve / Caminhada</option>
            <option value="Descanso / Off">Descanso / Off</option>
          </select>
        </div>
        <div class="form-group">
          <label for="n_humor">Avaliação do Dia / Humor (1 a 5):</label>
          <div class="range-container">
            <input type="range" id="n_humor" min="1" max="5" value="3" oninput="document.getElementById('v_humor').innerText = this.value">
            <span class="range-value" id="v_humor">3</span>
          </div>
        </div>
      `;
    }

    document.getElementById('ritoTitulo').innerText = `🧭 ${ritoNome}`;

    // Evento de envio do formulário
    document.getElementById('bussolaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      let respostaString = "";

      if (ritoNome === "Rito da Manhã") {
        respostaString = "Disposição/Rigidez: " + document.getElementById('m_disposicao').value + "/5";
      } else if (ritoNome === "Rito da Tarde") {
        respostaString = "Pausas: " + document.getElementById('pausaVal').value + " | Hidratação/Foco: " + document.getElementById('t_hidratacao').value + "/5";
      } else if (ritoNome === "Rito da Noite") {
        respostaString = "Treino: " + document.getElementById('treinoVal').value + " | Humor: " + document.getElementById('n_humor').value + "/5";
      }

      const btn = document.getElementById('btnEnviar');
      const statusDiv = document.getElementById('status');

      btn.disabled = true;
      btn.innerText = "Salvando...";
      statusDiv.style.color = "#38bdf8";
      statusDiv.innerText = "Enviando registro...";

      const payload = {
        chatId: userChatId,
        nome: userName,
        rito: ritoNome,
        resposta: respostaString
      };

      // Envio otimizado para contornar limitações de CORS dentro do iFrame do Telegram
      fetch(URL_DO_APPS_SCRIPT, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: "payload=" + encodeURIComponent(JSON.stringify(payload))
      })
      .then(() => {
        statusDiv.style.color = "#4ade80";
        statusDiv.innerText = "✅ Registro salvo com sucesso!";
        setTimeout(() => { tg.close(); }, 1200);
      })
      .catch((err) => {
        statusDiv.style.color = "#f87171";
        statusDiv.innerText = "❌ Falha ao salvar.";
        btn.disabled = false;
        btn.innerText = "Salvar Registro";
      });
    });
  </script>
</body>
</html>
